[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "qkdsim"
version = "0.1.0"
description = "Mô phỏng phân phối khóa lượng tử BB84"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "PyYAML==6.0.2",
    "typer==0.15.4",
    "click==8.1.8",
    "rich==14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.1.1",
    "hypothesis==6.131.9",
    "ruff==0.11.8",
    "mypy==1.15.0",
    "pre-commit==4.2.0",
    "types-PyYAML==6.0.12.20250402",
]

[project.scripts]
qkdsim = "qkdsim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qkdsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["statistical: kiểm thử xác suất với seed cố định"]

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
